<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi-Language Translation Table</title>

<style>
table {
  border-collapse: collapse;
  width: 100%;
  margin-top: 20px;
  table-layout: auto;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: left;
  white-space: nowrap;
}

th:first-child,
td:first-child {
  width: 1%;
  text-align: center;
}

table select,
table button {
  margin: 5px 0;
  display: block;
  width: 100%;
  max-width: 300px;
}

input[type="text"] {
  width: 120px;
}
</style>
</head>

<body>

<div class="container">

<button onclick="location.href='index.html'">🔙 Back to the homepage</button>

<h2>Translation Table</h2>

<label>Select Topic:</label>
<select id="topicDropdown">
  <option value="">--Select--</option>
</select>

<label>Select Level:</label>
<select id="levelDropdown" disabled>
  <option value="">--Select--</option>
  <option value="A">A</option>
  <option value="B">B</option>
  <option value="C">C</option>
  <option value="A+B">A+B</option>
  <option value="A+C">A+C</option>
  <option value="B+C">B+C</option>
  <option value="ALL">ALL</option>
</select>

<label>Select Your Language:</label>
<select id="fromLangDropdown">
  <option value="">--Select--</option>
</select>

<label>Select Translation Language 1:</label>
<select id="toLangDropdown1">
  <option value="">--Select--</option>
</select>

<label>Select Translation Language 2:</label>
<select id="toLangDropdown2">
  <option value="">--Select--</option>
</select>

<label>Select Translation Language 3:</label>
<select id="toLangDropdown3">
  <option value="">--Select--</option>
</select>

<label>Select Translation Language 4:</label>
<select id="toLangDropdown4">
  <option value="">--Select--</option>
</select>

<button id="showTableBtn" disabled>Show Table</button>

<table id="translationTable" style="display:none;">
  <thead>
    <tr id="tableHeadRow">
      <th>#</th>
      <th></th>
      <th>Word</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

</div>

<script>

let jsonData = {};
let selectedTopic = '';
let selectedLevel = '';
let availableLanguages = [];

const topicDropdown = document.getElementById('topicDropdown');
const levelDropdown = document.getElementById('levelDropdown');
const fromLangDropdown = document.getElementById('fromLangDropdown');
const toLangDropdown1 = document.getElementById('toLangDropdown1');
const toLangDropdown2 = document.getElementById('toLangDropdown2');
const toLangDropdown3 = document.getElementById('toLangDropdown3');
const toLangDropdown4 = document.getElementById('toLangDropdown4');
const showTableBtn = document.getElementById('showTableBtn');

const allDropdowns = [
  fromLangDropdown,
  toLangDropdown1,
  toLangDropdown2,
  toLangDropdown3,
  toLangDropdown4
];

function resetLanguageDropdowns() {
  allDropdowns.forEach(dropdown => {
    dropdown.innerHTML = '<option value="">--Select--</option>';
  });
}

function getSelectedLevels(level) {
  switch (level) {
    case "A": return ["A"];
    case "B": return ["B"];
    case "C": return ["C"];
    case "A+B": return ["A", "B"];
    case "A+C": return ["A", "C"];
    case "B+C": return ["B", "C"];
    case "ALL": return ["A", "B", "C"];
    default: return [];
  }
}

fetch('vocab-l.json')
.then(res => res.json())
.then(data => {
  jsonData = data;

  for (const topic in data) {
    const option = document.createElement('option');
    option.value = topic;
    option.textContent = topic;
    topicDropdown.appendChild(option);
  }
});

topicDropdown.addEventListener('change', function () {
  selectedTopic = this.value;
  selectedLevel = '';
  levelDropdown.disabled = !selectedTopic;
  levelDropdown.selectedIndex = 0;
  resetLanguageDropdowns();
  showTableBtn.disabled = true;
});

levelDropdown.addEventListener('change', function () {
  selectedLevel = this.value;
  resetLanguageDropdowns();
  showTableBtn.disabled = true;

  if (!selectedTopic || !selectedLevel) return;

  const levels = getSelectedLevels(selectedLevel);
  let firstEntry = null;

  for (const lvl of levels) {
    if (jsonData[selectedTopic][lvl]) {
      const entries = Object.values(jsonData[selectedTopic][lvl]);

      if (entries.length > 0) {
        firstEntry = entries[0];
        break;
      }
    }
  }

  if (!firstEntry) return;

  availableLanguages = ["english", ...Object.keys(firstEntry)];

  allDropdowns.forEach(dropdown => {
    availableLanguages.forEach(lang => {
      const option = document.createElement('option');
      option.value = lang;
      option.textContent = lang;
      dropdown.appendChild(option.cloneNode(true));
    });
  });
});

function checkEnable() {
  showTableBtn.disabled = !(
    topicDropdown.value &&
    levelDropdown.value &&
    fromLangDropdown.value &&
    toLangDropdown1.value
  );
}

fromLangDropdown.addEventListener('change', checkEnable);
toLangDropdown1.addEventListener('change', checkEnable);

function createHideableCell(word) {
  const cell = document.createElement('td');

  const span = document.createElement('span');
  span.textContent = word;

  const hideBtn = document.createElement('button');
  hideBtn.textContent = 'Hide';

  cell.appendChild(span);
  cell.appendChild(hideBtn);

  hideBtn.addEventListener('click', function () {
    cell.innerHTML = '';

    const input = document.createElement('input');
    input.type = 'text';

    const checkBtn = document.createElement('button');
    checkBtn.textContent = 'Check';

    const result = document.createElement('span');

    checkBtn.addEventListener('click', function () {
      const userAnswer = input.value.trim().toLowerCase();
      const correctAnswer = word.trim().toLowerCase();

      if (userAnswer === correctAnswer) {
        result.textContent = ' Correct';
        result.style.color = 'green';
      } else {
        result.textContent = ' Wrong';
        result.style.color = 'red';
      }

      setTimeout(() => {
        cell.innerHTML = '';
        cell.appendChild(span);
        cell.appendChild(hideBtn);
      }, 1500);
    });

    cell.appendChild(input);
    cell.appendChild(checkBtn);
    cell.appendChild(result);
  });

  return cell;
}

showTableBtn.addEventListener('click', function () {

  const fromLang = fromLangDropdown.value;

  const toLangs = [
    toLangDropdown1.value,
    toLangDropdown2.value,
    toLangDropdown3.value,
    toLangDropdown4.value
  ].filter(Boolean);

  const table = document.getElementById('translationTable');
  const tableHeadRow = document.getElementById('tableHeadRow');
  const tableBody = document.querySelector('#translationTable tbody');

  tableHeadRow.innerHTML = '<th>#</th><th></th><th>Word</th>';
  tableBody.innerHTML = '';

  toLangs.forEach(lang => {
    const th = document.createElement('th');
    th.textContent = `Translation (${lang})`;
    tableHeadRow.appendChild(th);
  });

  const selectedLevels = getSelectedLevels(selectedLevel);

  let counter = 1;

  selectedLevels.forEach(level => {
    if (!jsonData[selectedTopic][level]) return;

    for (const [englishWord, translations] of Object.entries(jsonData[selectedTopic][level])) {

      const row = document.createElement('tr');

      const numberCell = document.createElement('td');
      numberCell.textContent = counter++;
      row.appendChild(numberCell);

      const toggleCell = document.createElement('td');
      const toggleBtn = document.createElement('button');
      toggleBtn.textContent = '−';
      toggleCell.appendChild(toggleBtn);
      row.appendChild(toggleCell);

      const fromWord =
        fromLang === 'english'
        ? englishWord
        : translations[fromLang] || '-';

      row.appendChild(createHideableCell(fromWord));

      toLangs.forEach(lang => {
        const word =
          lang === 'english'
          ? englishWord
          : translations[lang] || '-';

        row.appendChild(createHideableCell(word));
      });

      tableBody.appendChild(row);

      toggleBtn.addEventListener('click', function () {
        row.style.display = 'none';
      });
    }
  });

  table.style.display = 'table';

});

</script>

</body>
</html>
